name: Daily publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'   # يوميًا 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Daily content touch (editable.json lastmod)
        run: |
          sed -i "s/\"updatedAt\": \"[^\"]*\"/\"updatedAt\": \"$(date +%F)\"/" public/editable.json
      - run: npm run build
      - name: Publish to Pages repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/Mouhamed-ui-gif/ghennai-app.git" /tmp/pages
          rsync -a --delete --exclude .git dist/ /tmp/pages/
          cd /tmp/pages
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "daily publish $(date +%F)" || exit 0
          git push origin main